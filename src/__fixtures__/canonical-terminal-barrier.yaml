id: terminal-barrier
version: 1
archetype: orchestrator
entry_state: managing

break_glass:
  command: escape
  to: escape
  owner_role: steward

states:
  - id: managing
    owner_role: steward
    kind: normal
    native_state: managing
    barrier: true
    transitions:
      - command: complete
        to: done

  - id: done
    kind: terminal
    native_state: done

  - id: escape
    kind: terminal
    native_state: invalid
