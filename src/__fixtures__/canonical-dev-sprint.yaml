# GENERATED from src/registered-defs/dev-sprint.yaml — do not hand-edit.
# Regenerate: node scripts/check-workflow-def-sync.mjs --write dev-sprint
# The canonical fixture is a mirror of the registered-def (INF-723 single-source rule).

id: dev-sprint
version: 12
archetype: orchestrator
entry_state: intake

# INF-311: escape → product-definition recovery state (was intake)
# Tickets already in escape state migrate to product-definition for recovery.
migrations:
  escape: product-definition

break_glass:
  command: escape
  to: product-definition
  owner_role: steward

states:

  - id: intake
    owner_role: steward
    kind: normal
    native_state: todo
    description: >
      Capture Matt's sprint description; set project/milestone; sanity-check
      scope is sprint-shaped.
    transitions:
      - command: accept
        to: product-definition
        generic: continue          # AI-2519: `linear continue-workflow` resolves

  - id: product-definition
    owner_role: steward
    kind: normal
    native_state: doing
    description: >
      Problem statement, target user, success criteria, scope boundary (in/out),
      MVP definition. Decides arm composition (spike in/out, design arm in/out
      for backend-only sprints). Output: structured brief + arm spawn spec.
    transitions:
      - command: continue
        to: spawn-arms
        generic: continue
        requires_capability_statement: true

  - id: spawn-arms
    owner_role: engine
    kind: normal
    native_state: doing
    description: >
      Fanout phase 1: create arm tickets from spec. Each is a wf:sprint-arm-*
      ticket, parentId = sprint. INF-258: when the ## Structured section is
      missing on spawn, the engine auto-derives it from existing arm children
      (if any) or from the ticket description, so the spawn never stalls.
    # INF-45 (2026-07-16): arm workflows registered as v0 stubs
    # (sprint-arm-scope, sprint-arm-ux, sprint-arm-design, sprint-arm-spike).
    fanout:
      spec_source: structured
      child_workflow: wf:sprint-arm-scope    # representative — actual per-arm spec in source
      initial_delegate: astrid
    transitions:
      - command: spawn
        to: managing-arms
        generic: continue
      - command: cancel
        to: cancelled
        generic: cancel
      - command: abandon
        to: cancelled
        generic: cancel

  - id: managing-arms
    owner_role: steward
    kind: barrier
    barrier: true
    native_state: managing
    description: >
      Barrier: all arm children terminal → auto-advance.
    transitions:
      - command: continue
        to: ac-definition
        generic: continue
      - command: cancel
        to: cancelled
        generic: cancel
      - command: abandon
        to: cancelled
        generic: cancel

  - id: ac-definition
    owner_role: steward
    kind: normal
    native_state: doing
    description: >
      Synthesize arm outputs → sprint-level AC of record + impl spawn spec:
      enumerated impl tickets (wf:dev-impl or wf:chore), titles, AC, scope labels,
      blocking relations. Must include >=1 debt/refactor ticket or documented waiver.
    transitions:
      - command: continue
        to: spawn-impl
        generic: continue
      # INF-504: governed completion when implementation shipped out-of-band.
      # `continue` here mints a redundant impl arm (INF-271 debt); `converge`
      # is the terminal edge for a sprint whose tracked work is already Done.
      # Gated on all children terminal (acceptance walk satisfied) + a steward
      # attestation comment. Steward-only via delegate-gating. Fire with
      # `linear transition <id> converge`.
      - command: converge
        to: done
        requires_children_terminal: true
        # INF-758: converge is a false-Done hole unless a real impl child shipped.
        # requires_children_terminal is satisfied vacuously by scope/design arms
        # (wf:sprint-arm-*) — the LIF-291 defect. Require >=1 COMPLETED impl child.
        requires_implementation_child: true
        requires_comment: true

  - id: spawn-impl
    owner_role: engine
    kind: normal
    native_state: doing
    description: >
      Fanout phase 2: create impl tickets from spec. Children are wf:dev-impl
      (default) or wf:chore. Both are registered defs.
    fanout:
      spec_source: findings
      child_workflow: wf:dev-impl
      initial_delegate: astrid
      classification_required: true
      classification_field: classification
      allowed_classifications:
        - traces-to-capability
        - declared-standalone
      standalone_share_nudge_above: 0.5
      integration_verify:
        child_workflow: wf:integration-verify
        per_capability: true
        blocked_by: capability-components
    transitions:
      - command: spawn
        to: managing-impl
        generic: continue
      # INF-528: governed completion when the impl children were already spawned
      # and shipped out-of-band, leaving the sprint wedged here. From spawn-impl
      # the only other move is `spawn` — which dedups to a no-op once children
      # exist (v7) and never advances — so `converge → done` was unreachable
      # (INF-504 covered ac-definition + managing-impl but not spawn-impl). Same
      # gate as the other converge edges: all children terminal (acceptance walk
      # satisfied) + a steward attestation comment. Fire with
      # `linear transition <id> converge`. Live victim: LSO-1 (children LSO-5/6/7
      # all Done, wedged at spawn-impl for 2 days).
      - command: converge
        to: done
        requires_children_terminal: true
        # INF-758: converge is a false-Done hole unless a real impl child shipped.
        # requires_children_terminal is satisfied vacuously by scope/design arms
        # (wf:sprint-arm-*) — the LIF-291 defect. Require >=1 COMPLETED impl child.
        requires_implementation_child: true
        requires_comment: true

  - id: managing-impl
    owner_role: steward
    kind: barrier
    barrier: true
    native_state: managing
    description: >
      Barrier: all children terminal → auto-advance. Astrid runs board-review
      discipline; stall handling via existing sweeps.
    transitions:
      - command: continue
        to: validation
        generic: continue
      # INF-504: governed completion when validation happened out-of-band and
      # the normal continue→validation walk is redundant. Same gate as the
      # ac-definition edge: all children terminal + steward attestation comment.
      - command: converge
        to: done
        requires_children_terminal: true
        # INF-758: converge is a false-Done hole unless a real impl child shipped.
        # requires_children_terminal is satisfied vacuously by scope/design arms
        # (wf:sprint-arm-*) — the LIF-291 defect. Require >=1 COMPLETED impl child.
        requires_implementation_child: true
        requires_comment: true

  - id: validation
    owner_role: steward
    kind: normal
    native_state: thinking
    description: >
      Author Matt-facing sprint validation. cra reviews technical accuracy.
      requires_human_signoff_above_stakes — the human sign-off is captured HERE,
      on Matt's explicit yes. On approve the sprint advances to post-validation
      (the mechanical visual-audit gate), not directly to done.
    transitions:
      - command: approve
        to: post-validation
        generic: continue
        requires_human_signoff_above_stakes: true
        requires_demonstration_walk: true
      - command: reject
        to: ac-definition
        generic: revision

  - id: post-validation
    owner_role: steward
    kind: normal
    native_state: doing
    description: >
      v5 (INF-176): visual-audit gate with design-provenance awareness. Spawns
      a wf:ui-audit child when the sprint itself carries `wf:design-provenance`
      OR when a closed child carries `ui-impact`. The human sign-off was already captured at
      validation→approve, so this transition is mechanical (no signoff). The
      milestone-close verification comment carries the Visual Audit breakpoint
      table + sign-off checkbox (see dev-sprint-milestone-close-template.ts).
    fanout:
      spec_source: findings
      child_workflow: wf:ui-audit
      initial_delegate: astrid
      spawn_if:
        label_present: ui-impact
        scope: closed_children
    transitions:
      - command: continue
        to: done
        generic: continue

  - id: done
    kind: terminal
    barrier: true
    native_state: done
    satisfies_parent_barrier: true

  # v7: explicit cancellation — a sprint can be terminated via break-glass
  # escape to cancelled state. Not a normal forward path.
  - id: cancelled
    kind: terminal
    barrier: true
    native_state: done
    description: >
      Sprint terminated without completing all arms. Used via break-glass
      escape, not normal forward progression.
