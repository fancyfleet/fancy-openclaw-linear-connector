# task — Archetype A workflow definition (the general delegated request)
# design.md §13b, §16.1 (role-binding modes), §16.5 (department roster)
# owner: steward (Astrid)
# version history: bump `version` on any state/edge change; in-flight tickets
#   use the version stamped at their creation time (design.md §12).
#
# Purpose: "ask a department to do something." Second Archetype-A workflow;
#   reuses the dev-impl engine entirely (single-command transition+assign §4.3,
#   break-glass §4.4, categorized feedback §8.2). Adds NO engine features — only
#   role-binding modes and a department roster.
#
# Anti-orphan property (born from AI-1375): `done` is reachable ONLY through
#   `sign-off`, owned by the requester. No state has a "drop the delegate / set
#   To Do" exit, so a task cannot be abandoned and the requester always closes
#   it. Two gates, not redundant: department-head `review` = "is this good work?"
#   (domain quality); requester `sign-off` = "is this what I asked for?" (fit).
#
# Completion path (all forward edges are `generic: continue`, so a single agent
#   verb — `linear continue-workflow` — carries a ticket the whole way):
#     intake --request--> routing --assign--> doing --submit--> review
#            --approve--> merge --continue--> sign-off --accept--> done
#   `request-revision` walks the two revision edges (review→doing, sign-off→doing).
#   It is also legal from intake as a steward recovery edge for bounced worker
#   tickets whose labels re-entered at intake while the requested revision still
#   belongs with the prior/intended worker.
#
# Break-glass (AI-2095): escape RE-ENTERS the workflow at `intake`, it does NOT
#   land in a terminal state. Before AI-2095, break_glass.to pointed at a
#   terminal `escape` state (native Invalid) whose only legal move was `escape`
#   again — a roach motel: an escaped ticket could never reach a clean terminal
#   by agent verbs (GEN-103 wedged there; AI-1755 stalled). This is the exact
#   trap dev-impl already removed in AI-1710; task.yaml now matches that proven
#   model. From `intake` an escaped ticket has a full forward path to `done`
#   (via continue-workflow) AND a `demote` exit to ad-hoc — so it is always
#   dispositionable without human DB surgery. A ticket already carrying a stale
#   `state:escape` label (created before this fix) recovers by running `escape`
#   once more: break-glass short-circuits state validation and lands it at
#   intake.
#
# Role-binding modes (design.md §16.1):
#   - requester        → instance   (pinned at creation; ∈ {matt, ai}; Ai is the
#                                     de-facto sign-off authority)
#   - department-head  → domain-routed (resolved from the department the requester
#                                     picked at intake, via department-roster.yaml
#                                     §16.5; pinned for the ticket, so `routing`
#                                     and `review` share the SAME head)
#   - worker           → static-from-department (legal set = the chosen
#                                     department's workers; `not-self` so the head
#                                     can't assign itself and self-review)
#   Astrid is the catch-all head/reviewer when no department matches.
#
# Single-domain only: a request spanning domains decomposes into a mini-sprint
#   (Archetype C, §14b), it is not a `task`.

id: task
version: 5                      # INF-1164: wf:task deprecated in favor of wf:chore; def stays
                              #   registered so in-flight tickets finish (grandfather).
                              #   (v4, INF-942: department scope is instance-resolved from enrollment context)
archetype: single-task         # single-task | orchestrator | feature-initiative
entry_state: intake

# INF-1164: wf:task is deprecated in favor of wf:chore. The def stays fully
#   registered and loadable so in-flight tickets can finish (grandfather); new
#   enrollment is blocked in the bootstrap/fanout paths, not here.
deprecated:
  replacement: "wf:chore"
  new_enrollment: false
  reason: "INF-1164: wf:task deprecated in favor of wf:chore; def stays registered so in-flight tickets finish (grandfather)."
  since: "2026-08-03"

# department_scope is resolved from ticket enrollment context at runtime
# (see deriveWorkflowInstanceScope in workflow-gate.ts). The static default
# is intentionally absent — each enrollment provides its own department scope
# via WorkflowInstanceContext.workflowEnrollment.
#
# This replaced the previously hardcoded {department: DSN, team: Design} default
# (INF-942) which misrouted every wf:task ticket to the Design head regardless
# of its actual department.

break_glass:
  command: escape
  to: intake                   # AI-2095: re-enter recoverably at intake, not a terminal trap
  owner_role: steward          # implicit escape edge from EVERY state (design.md §4.4)

# AI-2095: v2 removes the terminal `escape` state. AC3 (AI-1914) refuses to
#   activate a def that drops a state without a migrations mapping — and, more
#   importantly, this mapping is what auto-migrates the already-wedged tickets:
#   the def-state-migration sweep relabels every `state:escape` ticket (GEN-103,
#   AI-1755) to `state:intake`, from which continue-workflow carries it to done.
#   Without this line the v2 def would fail closed on load AND the live escaped
#   tickets would remain stranded. Mapping target = break_glass.to (intake).
migrations:
  escape: intake

# INF-862: explicit non-code release contract. A `task` deliverable is a
#   department doing something (a governed Linear workflow action, a decision,
#   a doc) — NOT a code change. It therefore has no branch or pull request, and
#   must never be routed onto the dev-impl merge/deploy spine, whose release gate
#   requires branch/PR evidence (§5.6). INF-850 was a wf:task deliverable that
#   reached the dev-impl `merge` state and stranded because no PR exists by
#   design; Hanzo could not complete, needs-human, or force-deploy cleanly.
#   This block declares the sanctioned release path for approved non-code tasks:
#   the requester's `sign-off` state is the approval gate, `accept` carries the
#   ticket to the `done` terminal via `linear continue-workflow`, and NO GitHub
#   PR evidence is required. See config-templates/workflows/task/release.md.
release:
  kind: non-code-task
  approved_state: sign-off      # requester approval gate (owner_role: requester)
  terminal_state: done          # reached via `accept` (generic: continue)
  requires_github_pr_evidence: false

states:

  - id: intake
    owner_role: requester      # instance-bound at creation (∈ {matt, ai}) — pinning unimplemented
    kind: normal
    native_state: todo
    transitions:
      - command: request
        to: routing
        generic: continue      # `linear continue-workflow` — routing auto-assigns the head (singleton)
        assign: { mode: auto }
      - command: request-changes
        to: doing
        generic: revision      # `linear request-revision <worker>` — recovery from bounced intake
        assign:
          mode: required       # worker is multi-body; do not guess
        feedback:
          required: true
          category_enum:
            - incomplete
            - off-brief
            - quality
            - scope-creep
            - correctness
      - command: demote
        to: __ad_hoc__         # leaves the workflow entirely (design.md §4.5) — also the escape exit

  - id: routing
    owner_role: department-head    # resolved from chosen department; pinning unimplemented
    kind: normal
    native_state: todo
    transitions:
      - command: assign
        to: doing
        generic: continue          # `linear continue-workflow <worker>`
        assign:
          mode: required           # multi-body worker role — explicit target mandatory
          constraint: not-self     # head cannot self-assign the worker slot (ENFORCED)

  - id: doing
    owner_role: worker
    kind: normal
    native_state: todo
    # entered from intake-routing/assign, review/request-changes, and
    # sign-off/reject — one worker work-phase, no awaiting-vs-doing split.
    transitions:
      - command: submit
        to: review
        generic: continue      # `linear continue-workflow` — review auto-assigns the head (singleton)
        assign: { mode: auto }
        requires_deploy_probe: true

  - id: review
    owner_role: department-head    # SAME body as routing (domain-routed, pinned)
    kind: normal
    native_state: todo
    sla: 24h                       # time-in-state; breach → stall escalation (design.md §5.5)
    transitions:
      - command: approve
        to: merge
        generic: continue      # `linear continue-workflow` — merge auto-assigns Hanzo
        assign: { mode: auto }
      - command: request-changes
        to: doing
        generic: revision      # `linear request-revision`
        assign: { default: prior-implementer }   # returns to the worker who submitted (ENFORCED, def-driven)
        feedback:
          required: true
          category_enum:
            - incomplete
            - off-brief
            - quality
            - scope-creep
            - correctness

  - id: merge
    owner_role: deployment          # Hanzo; protected-main merge gate
    kind: normal
    native_state: todo
    sla: 4h
    transitions:
      - command: continue
        to: sign-off
        generic: continue           # after merge, requester sign-off can close
        requires_capability: deploy:execute
        assign:
          mode: auto
          selection_criteria: original-requester
      - command: reject
        to: doing
        requires_comment: true
        assign: { default: prior-implementer }
        feedback:
          required: true
          category_enum:
            - incomplete
            - off-brief
            - quality
            - scope-creep
            - correctness

  - id: sign-off
    owner_role: requester          # SAME body as intake (instance-bound: matt or ai)
    kind: approval_gate            # INF-562: rests for requester sign-off; prior review approval cannot auto-complete it
    native_state: todo
    transitions:
      - command: accept
        to: done                   # terminal
        generic: continue          # `linear continue-workflow`
        requires_deploy_probe: true
      - command: reject
        to: doing
        generic: revision          # `linear request-revision`
        assign: { default: prior-implementer }   # returns to the worker who submitted (ENFORCED, def-driven)
        feedback:
          required: true
          category_enum:
            - incomplete
            - off-brief
            - quality
            - scope-creep
            - correctness

  - id: done
    kind: terminal
    native_state: done
    satisfies_parent_barrier: true   # uniform terminal contract (design.md §5.4)
